{% set name = "dbt-core" %}
{% set version = "1.11.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/dbt_core-{{ version }}.tar.gz
  sha256: e53cfccc8c9c13a082e518bf80cf3bb33c2f1fdc3cab48ec822ef93737eccb81

build:
  entry_points:
    - dbt = dbt.cli.main:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling
  run:
    - python >=3.10
    - agate >=1.7.0,<1.10
    - click >=8.3.0,<9.0
    - daff >=1.3.46
    - dbt-adapters >=1.15.5,<2.0
    - dbt-common >=1.37.3,<2.0
    - dbt-extractor >=0.5.0,<=0.6
    - dbt-protos >=1.0.405,<2.0
    - dbt-semantic-interfaces >=0.9.0,<0.10
    - jinja2 >=3.1.3,<4
    - jsonschema >=4.19.1,<5.0
    - mashumaro >=3.9,<3.15
    - networkx >=2.3,<4.0
    - packaging >20.9
    - pathspec >=0.9,<0.13
    - protobuf >=6.0,<7.0
    - pydantic <3
    - pytz >=2015.7
    - pyyaml >=6.0
    - requests <3.0.0
    - snowplow-tracker >=1.0.2,<2.0
    - sqlparse >=0.5.5,<0.6.0
    - typing-extensions >=4.4

test:
  imports:
    - dbt
  commands:
    - pip check
    - dbt --help
  requires:
    - pip

about:
  home: https://github.com/dbt-labs/dbt-core
  summary: With dbt, data analysts and engineers can build analytics the way engineers build applications.
  license: Apache-2.0
  license_file: LICENSE

extra:
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/63495
    reason: Client request
  recipe-maintainers:
    - ianaobi
    - bkreider
