{% set name = "dbt-core" %}
{% set version = "1.12.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: d608042c9ff034c0e11d06123a00b79cdf21b12068aac580e90e8326f1872c52

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - dbt = dbt.cli.main:cli
  skip: true # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - agate >=1.7.0,<1.15
    - jinja2 >=3.1.3,<4
    # mashumaro[msgpack]>=3.9,<3.18
    - mashumaro >=3.9,<3.18
    # https://github.com/Fatal1ty/mashumaro/blob/v3.17/pyproject.toml#L34C1-L34C29
    - msgpack >=0.5.6
    - click >=8.3.0,<9.0
    - jsonschema >=4.19.1,<5.0
    - networkx >=2.3,<4.0
    - protobuf >=6.0,<8.0
    - requests <3.0.0
    - snowplow-tracker >=1.0.2,<2.0
    - pathspec >=0.9,<1.1
    - sqlparse >=0.5.5,<0.7.0
    - dbt-extractor >=0.5.0,<=0.6
    - metricflow >=0.211.0,<1.0
    - dbt-common >=1.37.5,<2.0
    - dbt-adapters >=1.24.5,<2.0
    - dbt-protos >=1.0.514,<2.0
    - dbt-core-experimental-parser >=2.0.0,<3
    - pydantic <3
    - packaging >20.9
    - pytz >=2015.7
    - pyyaml >=6.0
    - daff >=1.3.46
    - python-dotenv >=1.2
    - typing-extensions >=4.4
    - opentelemetry-api >=1.26,<2.0

test:
  imports:
    - dbt
  commands:
    - pip check
    - dbt --help
  requires:
    - pip

about:
  home: https://github.com/dbt-labs/dbt-core
  summary: With dbt, data analysts and engineers can build analytics the way engineers build applications.
  license: Apache-2.0
  license_file: LICENSE

extra:
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/63495
    reason: Client request
  recipe-maintainers:
    - ianaobi
    - bkreider
